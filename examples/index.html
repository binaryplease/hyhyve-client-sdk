<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,height=device-height,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>HyHyve SDK Example</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./example.ts"></script>
</head>

<body class="h-screen w-screen m-0 p-0 flex text-sm bg-linear-to-br from-indigo-500 to-purple-600 text-white font-sans">
  <div class="flex-1 p-5 flex flex-row gap-5 box-border min-h-0" 
       style="background-image: url('./noisy-texture-100x100-o4-d10-c-f34379-t1.png'); background-repeat: repeat; background-size: 100px 100px; background-blend-mode: multiply;">
    <div class="p-2 shrink-0">
      <h2 class="text-lg font-semibold">HyHyve</h2>
      <h1 class="text-2xl font-bold">Web Component SDK</h1>
      <p class="mt-2">This example demonstrates the HyHyve SDK integration.</p>
      <p class="mt-2">
        <a href="https://www.npmjs.com/package/@hyhyve/client-sdk" target="_blank" 
           class="text-white no-underline hover:underline">↗️ View Documentation</a>
      </p>

      <div class="mt-5">
        <label for="spaceIdInput" class="block mb-2 font-medium">Space ID:</label>
        <input id="spaceIdInput" 
               type="text" 
               value="HyHyvePub" 
               placeholder="Enter space ID" 
               class="w-[200px] px-3 py-2 border border-white/30 rounded-md bg-white/10 text-white text-sm mb-4 placeholder:text-white/60 focus:outline-none focus:border-white/60 focus:bg-white/15" />
      </div>

      <div class="mt-5 flex gap-3 flex-wrap">
        <button id="attachBtn" 
                class="inline-flex items-center px-5 py-2.5 border-0 text-sm font-bold rounded-lg bg-green-400 text-white cursor-pointer hover:bg-green-500 transition-colors">
          Attach
        </button>

        <button id="randomizeBtn" 
                class="inline-flex items-center px-5 py-2.5 border-0 text-sm font-bold rounded-lg bg-purple-500 text-white cursor-pointer hover:bg-purple-600 transition-colors">
          🎲 New Identity
        </button>

        <button id="destroyBtn" 
                class="inline-flex items-center px-5 py-2.5 border-0 text-sm font-bold rounded-lg bg-red-400 text-white cursor-pointer hover:bg-red-500 transition-colors">
          Destroy
        </button>
      </div>
    </div>

    <div id="hyhyve" class="flex-auto rounded-[20px] overflow-hidden shadow-lg"></div>
  </div>
</body>

</html>
